<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collab Dev - Real-time Collaborative Dev Environment</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0e0e0e;
      color: #e0e0e0;
    }

    .container {
      display: flex;
      height: 100vh;
    }

    /* Auth Page */
    .auth-page {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .auth-card {
      background: white;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 400px;
      color: #333;
    }

    .auth-card h1 {
      margin-bottom: 30px;
      font-size: 28px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      background: #667eea;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #5568d3;
    }

    .form-footer {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .form-footer a {
      color: #667eea;
      cursor: pointer;
      text-decoration: underline;
    }

    .hidden {
      display: none;
    }

    /* Dashboard Page */
    .dashboard-page {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      background: #1e1e1e;
      padding: 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      font-size: 24px;
    }

    .navbar-right {
      display: flex;
      gap: 20px;
      align-items: center;
    }

    .logout-btn {
      background: #dc3545;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: #c82333;
    }

    .main-content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 30px;
      margin-bottom: 40px;
    }

    .card {
      background: #2d2d2d;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #3d3d3d;
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    .card input {
      width: 100%;
      padding: 10px;
      background: #1e1e1e;
      border: 1px solid #3d3d3d;
      color: #e0e0e0;
      border-radius: 4px;
      margin-bottom: 15px;
    }

    .sessions-list {
      display: grid;
      gap: 15px;
    }

    .session-item {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 6px;
      border-left: 3px solid #667eea;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .session-item:hover {
      transform: translateX(5px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
    }

    .session-item h3 {
      margin-bottom: 8px;
    }

    .session-item p {
      font-size: 12px;
      color: #999;
    }

    .invite-code {
      background: #1a1a1a;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 12px;
      color: #4ec9b0;
      margin-top: 10px;
    }

    /* Editor Page */
    .editor-page {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .editor-header {
      background: #1e1e1e;
      padding: 15px 20px;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .editor-header h1 {
      font-size: 20px;
    }

    .editor-back {
      background: #667eea;
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      color: white;
      cursor: pointer;
      font-weight: 600;
    }

    .editor-container {
      display: flex;
      flex: 1;
      overflow: hidden;
      gap: 4px;
      padding: 4px;
      background: #0e0e0e;
    }

    .sidebar {
      width: 250px;
      background: #1e1e1e;
      border-right: 1px solid #333;
      overflow-y: auto;
      padding: 15px;
    }

    .sidebar h2 {
      font-size: 14px;
      margin-bottom: 15px;
      color: #999;
      text-transform: uppercase;
    }

    .file-tree {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .file-item {
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      transition: background 0.2s;
    }

    .file-item:hover {
      background: #2d2d2d;
    }

    .file-item.active {
      background: #667eea;
    }

    .editor-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #1e1e1e;
      border-radius: 4px;
    }

    .editor-tabs {
      display: flex;
      background: #252526;
      border-bottom: 1px solid #333;
      padding: 5px;
    }

    .editor-tab {
      padding: 8px 15px;
      background: transparent;
      border: none;
      color: #999;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-right: 5px;
    }

    .editor-tab.active {
      color: #e0e0e0;
      border-bottom-color: #667eea;
    }

    .code-editor {
      flex: 1;
      background: #1e1e1e;
      padding: 20px;
      font-family: 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.6;
      overflow: auto;
      color: #d4d4d4;
    }

    .terminal {
      height: 150px;
      background: #000;
      border-top: 1px solid #333;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow-y: auto;
      color: #0f0;
    }

    .right-sidebar {
      width: 200px;
      background: #1e1e1e;
      border-left: 1px solid #333;
      overflow-y: auto;
      padding: 15px;
    }

    .users-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .user-item {
      padding: 10px;
      background: #252526;
      border-radius: 4px;
      font-size: 13px;
    }

    .user-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 5px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ec9b0;
    }

    .status-dot.offline {
      background: #999;
    }

    .user-role {
      font-size: 11px;
      color: #999;
    }

    .code-line {
      white-space: pre;
    }

    .keyword { color: #569cd6; }
    .string { color: #ce9178; }
    .comment { color: #6a9955; }
    .function { color: #dcdcaa; }
  </style>
</head>
<body>

<!-- Login/Register Page -->
<div id="authPage" class="auth-page">
  <div class="auth-card">
    <h1 id="authTitle">Log In</h1>
    <form id="authForm">
      <div id="registerFields" class="hidden">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="john_doe" required>
        </div>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn">Log In</button>
    </form>
    <div class="form-footer">
      <span id="footerText">Don't have an account? <a onclick="toggleAuthMode()">Sign up</a></span>
    </div>
  </div>
</div>

<!-- Dashboard Page -->
<div id="dashboardPage" class="hidden dashboard-page">
  <div class="navbar">
    <h1>Collab Dev</h1>
    <div class="navbar-right">
      <span id="currentUser">User</span>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>
  
  <div class="main-content">
    <div class="grid">
      <!-- Create Session -->
      <div class="card">
        <h2>Create Session</h2>
        <input type="text" id="sessionName" placeholder="Session name" />
        <button class="btn" onclick="createSession()">Create</button>
      </div>

      <!-- Join Session -->
      <div class="card">
        <h2>Join Session</h2>
        <input type="text" id="joinCode" placeholder="Invite code" />
        <button class="btn" onclick="joinSession()">Join</button>
      </div>
    </div>

    <div style="margin-bottom: 20px;">
      <h2 style="margin-bottom: 20px;">My Sessions</h2>
      <div id="sessionsList" class="sessions-list"></div>
    </div>
  </div>
</div>

<!-- Editor Page -->
<div id="editorPage" class="hidden editor-page">
  <div class="editor-header">
    <h1 id="editorTitle">Session: Demo</h1>
    <button class="editor-back" onclick="backToDashboard()">← Back</button>
  </div>

  <div class="editor-container">
    <!-- File Tree -->
    <div class="sidebar">
      <h2>Files</h2>
      <div class="file-tree" id="fileTree"></div>
    </div>

    <!-- Main Editor -->
    <div class="editor-main">
      <div class="editor-tabs" id="editorTabs"></div>
      <div class="code-editor" id="codeEditor"></div>
      <div class="terminal" id="terminal"></div>
    </div>

    <!-- Users/Presence -->
    <div class="right-sidebar">
      <h2>Users</h2>
      <div class="users-list" id="usersList"></div>
    </div>
  </div>
</div>

<script>
  // App State
  let appState = {
    currentUser: null,
    currentSession: null,
    isLogin: true,
    sessions: [
      { id: 'sess1', name: 'React App', inviteCode: 'ABC123XYZ', role: 'owner' },
      { id: 'sess2', name: 'API Server', inviteCode: 'DEF456UVW', role: 'editor' },
      { id: 'sess3', name: 'Mobile App', inviteCode: 'GHI789RST', role: 'viewer' }
    ],
    files: [
      { id: 'f1', name: 'index.js', type: 'file', active: true },
      { id: 'f2', name: 'styles.css', type: 'file' },
      { id: 'f3', name: 'src', type: 'folder' },
      { id: 'f4', name: 'App.tsx', type: 'file' }
    ],
    users: [
      { id: 'u1', name: 'Alice', role: 'owner', online: true, color: '#FF6B6B' },
      { id: 'u2', name: 'Bob', role: 'editor', online: true, color: '#4ECDC4' },
      { id: 'u3', name: 'Charlie', role: 'viewer', online: false, color: '#95E1D3' }
    ]
  };

  const codeSnippet = `<span class="keyword">function</span> <span class="function">calculateSum</span>(a, b) {
  <span class="comment">// Real-time collaborative editing</span>
  <span class="keyword">const</span> result = a + b;
  <span class="keyword">return</span> result;
}

<span class="keyword">const</span> users = [
  { <span class="string">name</span>: <span class="string">"Alice"</span>, <span class="string">role</span>: <span class="string">"owner"</span> },
  { <span class="string">name</span>: <span class="string">"Bob"</span>, <span class="string">role</span>: <span class="string">"editor"</span> }
];`;

  function toggleAuthMode() {
    appState.isLogin = !appState.isLogin;
    const registerFields = document.getElementById('registerFields');
    const authTitle = document.getElementById('authTitle');
    const footerText = document.getElementById('footerText');

    if (appState.isLogin) {
      registerFields.classList.add('hidden');
      authTitle.textContent = 'Log In';
      footerText.innerHTML = "Don't have an account? <a onclick=\"toggleAuthMode()\">Sign up</a>";
    } else {
      registerFields.classList.remove('hidden');
      authTitle.textContent = 'Sign Up';
      footerText.innerHTML = "Already have an account? <a onclick=\"toggleAuthMode()\">Log in</a>";
    }
  }

  function handleAuth(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const username = document.getElementById('username').value || email.split('@')[0];
    
    appState.currentUser = { email, username };
    document.getElementById('currentUser').textContent = username;
    
    document.getElementById('authPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
    renderSessions();
  }

  document.getElementById('authForm').addEventListener('submit', handleAuth);

  function createSession() {
    const name = document.getElementById('sessionName').value;
    if (!name) return;

    const newSession = {
      id: 'sess' + Date.now(),
      name,
      inviteCode: Math.random().toString(36).substring(7).toUpperCase(),
      role: 'owner'
    };

    appState.sessions.push(newSession);
    document.getElementById('sessionName').value = '';
    renderSessions();
  }

  function joinSession() {
    const code = document.getElementById('joinCode').value;
    const session = appState.sessions.find(s => s.inviteCode === code);

    if (session) {
      appState.currentSession = session;
      document.getElementById('joinCode').value = '';
      showEditor();
    } else {
      alert('Invalid invite code');
    }
  }

  function renderSessions() {
    const list = document.getElementById('sessionsList');
    list.innerHTML = appState.sessions.map(s => `
      <div class="session-item" onclick="selectSession('${s.id}')">
        <h3>${s.name}</h3>
        <p>Role: ${s.role}</p>
        <div class="invite-code">${s.inviteCode}</div>
      </div>
    `).join('');
  }

  function selectSession(id) {
    appState.currentSession = appState.sessions.find(s => s.id === id);
    showEditor();
  }

  function showEditor() {
    document.getElementById('dashboardPage').classList.add('hidden');
    document.getElementById('editorPage').classList.remove('hidden');
    document.getElementById('editorTitle').textContent = `Session: ${appState.currentSession.name}`;
    renderFileTree();
    renderEditor();
    renderUsers();
  }

  function renderFileTree() {
    const tree = document.getElementById('fileTree');
    tree.innerHTML = appState.files.map(f => `
      <div class="file-item ${f.active ? 'active' : ''}" onclick="selectFile('${f.id}')">
        ${f.type === 'folder' ? '📁' : '📄'} ${f.name}
      </div>
    `).join('');
  }

  function selectFile(id) {
    appState.files.forEach(f => f.active = f.id === id);
    renderFileTree();
    renderEditor();
  }

  function renderEditor() {
    const editor = document.getElementById('codeEditor');
    const tabs = document.getElementById('editorTabs');

    tabs.innerHTML = appState.files.map(f => `
      <button class="editor-tab ${f.active ? 'active' : ''}" onclick="selectFile('${f.id}')">${f.name}</button>
    `).join('');

    editor.innerHTML = `<div class="code-line">${codeSnippet}</div>`;
  }

  function renderUsers() {
    const list = document.getElementById('usersList');
    list.innerHTML = appState.users.map(u => `
      <div class="user-item">
        <div class="user-status">
          <div class="status-dot ${u.online ? '' : 'offline'}"></div>
          <span>${u.name}</span>
        </div>
        <div class="user-role">${u.role}</div>
      </div>
    `).join('');
  }

  function backToDashboard() {
    document.getElementById('editorPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
  }

  function logout() {
    appState.currentUser = null;
    appState.currentSession = null;
    document.getElementById('dashboardPage').classList.add('hidden');
    document.getElementById('editorPage').classList.add('hidden');
    document.getElementById('authPage').classList.remove('hidden');
    document.getElementById('authForm').reset();
    appState.isLogin = true;
    toggleAuthMode();
  }

  // Simulate terminal output
  setInterval(() => {
    const terminal = document.getElementById('terminal');
    if (terminal && !document.getElementById('editorPage').classList.contains('hidden')) {
      const timestamp = new Date().toLocaleTimeString();
      terminal.textContent += `[${timestamp}] > npm run dev\n`;
      if (terminal.textContent.split('\n').length > 8) {
        terminal.textContent = terminal.textContent.split('\n').slice(-8).join('\n');
      }
      terminal.scrollTop = terminal.scrollHeight;
    }
  }, 3000);
</script>

</body>
</html>
